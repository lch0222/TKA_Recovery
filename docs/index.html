<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TKA 術後數位復健系統</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>TKA 術後數位復健系統</header>

  <div class="container">

    <!-- 首頁 -->
    <section id="homePage">
      <div class="card">
        <h2>您好，歡迎使用</h2>
        <div class="subtitle">今日目標：完成 4 回合膝關節復健運動</div>

        <h3>今日完成進度</h3>
        <p id="roundStatus">⬜第 1 回合 　⬜第 2 回合 　⬜第 3 回合 　⬜第 4 回合</p>

        <div class="progress-bar">
          <div id="dailyProgress" class="progress">0%</div>
        </div>

        <p>目前點數：<strong id="points">0</strong> 點</p>
      </div>

      <div class="card menu">
        <button onclick="showPage('exercisePage')">開始復健</button>
        <button onclick="showPage('achievementPage')">查看成就</button>
        <button onclick="showPage('educationPage')" class="secondary">衛教資訊</button>
        <button onclick="resetAll()" class="reset">系統歸零(開發用)</button>
      </div>
    </section>

    <!-- 復健頁 -->
    <section id="exercisePage" class="hidden">
      <div class="card">
        <h2 id="roundTitle">第 1 回合復健</h2>
        <div class="subtitle">目標：完成 10 次膝自彎運動</div>

        <div id="actionSelector" class="action-selector">
          <button type="button" class="action-select" data-action="1" onclick="selectAction(1)">足踝運動 (0/10)</button>
          <button type="button" class="action-select" data-action="2" onclick="selectAction(2)">大腿肌肉收縮運動 (0/10)</button>
          <button type="button" class="action-select" data-action="3" onclick="selectAction(3)">直抬腿運動 (0/10)</button>
          <button type="button" class="action-select" data-action="4" onclick="selectAction(4)">膝部屈曲伸直運動 (0/10)</button>
        </div>

        <button onclick="showPage('homePage')" class="secondary">返回首頁</button>
      </div>
    </section>

    <section id="actionPage" class="hidden">
      <div class="card action-card">
        <h2 id="actionTitle">足踝運動</h2>
        <div class="subtitle">完成此動作 10 次</div>

        <div class="action-layout">
          <div class="video-frame">
            <iframe
              id="actionVideo"
              title="Exercise instruction video"
              src=""
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen>
            </iframe>
            <div id="videoNotice" class="video-notice hidden">尚未設定此動作的影片</div>
          </div>

          <div class="action-controls">
            <div class="count">
              <span id="currentCount">0</span> / 10
            </div>

            <div class="progress-bar">
              <div id="exerciseProgress" class="progress">0%</div>
            </div>

            <div class="rep-status">
              <div id="repStatusText">播放影片後會依照影片進度自動記錄次數。</div>
            </div>

            <button id="startRepButton" onclick="startRecoveryAction()" class="success hidden">開始復健動作</button>
            <button id="actionBackButton" onclick="handleActionBack()" class="secondary">返回動作選擇</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 成就頁 -->
    <section id="achievementPage" class="hidden">
      <div class="card">
        <h2>我的成就</h2>
        <p>累積完成次數：<strong id="totalCount">0</strong> 次</p>
        <p>目前點數：<strong id="achievementPoints">0</strong> 點</p>

        <div id="badges">
          <span class="badge">尚未獲得成就</span>
        </div>

        <div id="badgeImage"></div>

        <button onclick="showPage('homePage')" class="secondary">返回首頁</button>
      </div>
    </section>

    <!-- 衛教頁 -->
    <section id="educationPage" class="hidden">
      <div class="card">
        <h2>術後衛教資訊</h2>
        <ul>
          <li>膝關節術後復健運動</li>
          <li>助行器使用方式</li>
          <li>上下樓梯技巧</li>
          <li>冰敷注意事項</li>
          <li>飲食與蛋白質攝取建議</li>
        </ul>

        <button onclick="showPage('homePage')" class="secondary">返回首頁</button>
      </div>
    </section>

  </div>
  <script src="script.js"></script>
</body>
</html>
